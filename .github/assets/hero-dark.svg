<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 272" width="1200" height="272" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
<title id="t">Poxi — aplicaciones de escritorio para Windows</title><desc id="d">Poxi, desarrollador de aplicaciones de escritorio para Windows. Panel de hardware en vivo con CPU, GPU y RAM, y chips con el stack: Tauri, React, Rust, Python y Electron.</desc>
<style>
.ink{fill:#e7edf5}
.dim{fill:#9aa3b5}
.faint{fill:#5a6478}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
text{text-rendering:geometricPrecision}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important}
 .motion-only{opacity:0}
 .static-only{opacity:1!important}
}
.static-only{opacity:0}
.run{animation:chase 9s linear infinite}
.r0{animation-delay:0s}
.r1{animation-delay:-3s}
.r2{animation-delay:-6s}
@keyframes chase{to{stroke-dashoffset:-100}}
.d1{animation:dr1 20s ease-in-out infinite}
.d2{animation:dr2 24s ease-in-out infinite}
@keyframes dr1{0%,100%{transform:translate(0,0)}50%{transform:translate(5%,-4%)}}
@keyframes dr2{0%,100%{transform:translate(0,0)}50%{transform:translate(-4%,5%)}}
.pulse{animation:pu 2.6s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.25}}
.meter{animation:grow 4s ease-in-out infinite;transform-origin:left}
@keyframes grow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.06)}}
</style>
<defs>
<clipPath id="panel"><rect x="0" y="0" width="1200" height="272" rx="12"/></clipPath>
<linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0d1120"/><stop offset="1" stop-color="#161b30"/>
</linearGradient>
<radialGradient id="l1"><stop offset="0" stop-color="#24C8DB" stop-opacity="0.22"/><stop offset="1" stop-color="#24C8DB" stop-opacity="0"/></radialGradient>
<radialGradient id="l2"><stop offset="0" stop-color="#7b5cff" stop-opacity="0.20"/><stop offset="1" stop-color="#7b5cff" stop-opacity="0"/></radialGradient>
<linearGradient id="pname" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#24C8DB"/><stop offset="0.55" stop-color="#7b5cff"/><stop offset="1" stop-color="#e23aff"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#24C8DB"/><stop offset="0.5" stop-color="#7b5cff"/><stop offset="1" stop-color="#e23aff"/>
</linearGradient>
</defs><rect x="0" y="0" width="1200" height="272" rx="12" fill="#0d1120"/><rect x="0" y="0" width="1200" height="272" rx="12" fill="url(#field)"/><g class="motion-only" clip-path="url(#panel)">
<ellipse cx="260" cy="70" rx="420" ry="170" fill="url(#l1)" class="d1"/>
<ellipse cx="880" cy="210" rx="380" ry="150" fill="url(#l2)" class="d2"/>
</g><rect x="1" y="44" width="1198" height="1" fill="#222a3d"/><circle cx="46" cy="22" r="4" fill="#54e6a6" class="pulse"/><text x="62" y="26" class="mono" font-size="13" letter-spacing="1.6" fill="#9aa3b5">POXI // DESKTOP WINDOWS DEVELOPER</text><text x="1160" y="26" class="mono" font-size="13" letter-spacing="1.6" fill="#5a6478" text-anchor="end">WINDOWS 10 | 11 [ES]</text>
<text x="56" y="148" font-size="78" font-weight="800" letter-spacing="-1.8" fill="url(#pname)">POXI</text>
<text x="56" y="192" font-size="21" fill="#9aa3b5">Aplicaciones de escritorio para Windows — HUD con voz, optimizador</text>
<text x="56" y="220" font-size="21" fill="#7b5cff">todo-en-uno, monitor de hardware y formateador FAT32 sin límites.</text>
