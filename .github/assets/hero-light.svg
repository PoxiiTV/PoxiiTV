<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 272" width="1200" height="272" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
<title id="t">Poxi — aplicaciones de escritorio para Windows</title><desc id="d">Poxi, desarrollador de aplicaciones de escritorio para Windows. Panel de hardware en vivo con CPU, GPU y RAM.</desc>
<style>
.ink{fill:#1f2328}
.dim{fill:#57606a}
.faint{fill:#818b98}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
text{text-rendering:geometricPrecision}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important}
 .motion-only{opacity:0}
 .static-only{opacity:1!important}
}
.static-only{opacity:0}
.run{animation:chase 14s linear infinite}
@keyframes chase{to{stroke-dashoffset:-100}}
.d1{animation:dr1 24s ease-in-out infinite}
.d2{animation:dr2 28s ease-in-out infinite}
@keyframes dr1{0%,100%{transform:translate(0,0)}50%{transform:translate(4%,-3%)}}
@keyframes dr2{0%,100%{transform:translate(0,0)}50%{transform:translate(-3%,3%)}}
.pulse{animation:pu 3s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.meter{animation:grow 5s ease-in-out infinite;transform-origin:left}
@keyframes grow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.04)}}
</style>
<defs>
<clipPath id="panel"><rect x="0" y="0" width="1200" height="272" rx="12"/></clipPath>
<linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f6f9"/>
</linearGradient>
<radialGradient id="l1"><stop offset="0" stop-color="#2756a8" stop-opacity="0.10"/><stop offset="1" stop-color="#2756a8" stop-opacity="0"/></radialGradient>
<radialGradient id="l2"><stop offset="0" stop-color="#6d94cc" stop-opacity="0.08"/><stop offset="1" stop-color="#6d94cc" stop-opacity="0"/></radialGradient>
</defs><rect x="0" y="0" width="1200" height="272" rx="12" fill="#ffffff"/><rect x="0" y="0" width="1200" height="272" rx="12" fill="url(#field)"/><g class="motion-only" clip-path="url(#panel)">
<ellipse cx="260" cy="70" rx="420" ry="170" fill="url(#l1)" class="d1"/>
<ellipse cx="880" cy="210" rx="380" ry="150" fill="url(#l2)" class="d2"/>
</g><rect x="1" y="44" width="1198" height="1" fill="#d0d7de"/><circle cx="46" cy="22" r="4" fill="#1a7f37" class="pulse"/><text x="62" y="26" class="mono" font-size="13" letter-spacing="1.6" fill="#57606a">POXI // DESKTOP WINDOWS DEVELOPER</text><text x="1160" y="26" class="mono" font-size="13" letter-spacing="1.6" fill="#818b98" text-anchor="end">WINDOWS [ES]</text>
<text x="56" y="150" font-size="76" font-weight="700" letter-spacing="-1.4" fill="#1f2328">POXI</text>
<text x="58" y="192" font-size="20" fill="#57606a">Aplicaciones de escritorio para Windows — herramientas que resuelven</text>
<text x="58" y="220" font-size="20" fill="#4b7bc0">problemas concretos, con una interfaz cuidada y fácil de usar.</text>
