<text x="758" y="98" class="mono" font-size="9.5" letter-spacing="1.6" fill="#2756a8">HARDWARE · EN VIVO</text>
<line x1="758" y1="108" x2="1126" y2="108" stroke="#d0d7de" stroke-width="1"/>
<text x="758" y="134" class="mono" font-size="11" fill="#57606a">CPU</text>
